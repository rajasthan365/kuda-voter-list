(function(){
  var META = {salt: 'A6nTXWBOOKQ9tV9uCDG/7A==', iv: 'QlmtbkiKJoARROuF', iter: 600000}, KEY = 'kuda-voter-key-v1';
  var $ = function(id){ return document.getElementById(id); };
  var b64 = function(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  var enc = function(a){ var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  var say = function(t){ $('m').textContent = t; };
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { say('यह ब्राउज़र पुराना है। नया Chrome या Safari इस्तेमाल करें।'); return; }
  var unlock = function(raw){
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function(k){ return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(META.iv)}, k, b64($('blob').textContent.trim())); })
      .then(function(pt){ return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); });
  };
  var show = function(html){ document.open(); document.write(html); document.close(); };
  var derive = function(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw.toLowerCase().replace(/[\s-]+/g, '')), 'PBKDF2', false, ['deriveBits'])
      .then(function(k){ return crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64(META.salt), iterations: META.iter, hash: 'SHA-256'}, k, 256); })
      .then(function(bits){ return new Uint8Array(bits); });
  };
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(b64(saved)).then(show).catch(function(){ try { localStorage.removeItem(KEY); } catch (e) {} });
  $('f').addEventListener('submit', function(e){
    e.preventDefault(); say('खोल रहा है…');
    var raw;
    derive($('p').value).then(function(r){ raw = r; return unlock(r); }).then(function(html){
      if ($('r').checked) try { localStorage.setItem(KEY, enc(raw)); } catch (e) {}
      show(html);
    }).catch(function(){ say('पासवर्ड गलत है'); });
  });
})();
